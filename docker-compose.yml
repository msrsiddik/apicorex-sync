# Standalone compose for the Sync plugin.
#
# Connects to the SHARED Postgres run from the apicorex (Core) repo's
# docker-compose.yml, exposed on the host at 15432. Start that stack first:
#
#   cd ../apicorex && docker compose up -d postgres
#   docker compose up --build
#
# The plugin also needs a running ApiCoreX Core to register with (CORE_URL,
# also run from the apicorex repo's docker-compose.yml) and the Identity
# plugin to have created the tenant schemas.
#
services:
  sync:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apicorex:apicorex@host.docker.internal:15432/apicorex?sslmode=disable}
      PLUGIN_API_KEY: ${PLUGIN_API_KEY:-change-me-plugin-key}
      CORE_URL: ${CORE_URL:-http://host.docker.internal:9999}
      PLUGIN_ADDR: ":${SYNC_PORT:-50052}"
      PLUGIN_BASE_URL: ${PLUGIN_BASE_URL:-http://sync:${SYNC_PORT:-50052}}
      # Optional: comma-separated tenant-wide collections.
      SYNC_SHARED_COLLECTIONS: ${SYNC_SHARED_COLLECTIONS:-}
      # How long deleted-record tombstones are kept before being purged (Go
      # duration syntax). Defaults to 90 days if unset.
      SYNC_TOMBSTONE_RETENTION: ${SYNC_TOMBSTONE_RETENTION:-2160h}
    ports:
      - "${SYNC_PORT:-50052}:${SYNC_PORT:-50052}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
