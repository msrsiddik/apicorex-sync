# Standalone compose for the Sync plugin.
#
# Connects to the SHARED Postgres run from the apicorex (Core) repo's
# docker-compose.yml, exposed on the host at 55432. Start that stack first:
#
#   cd ../apicorex && docker compose up -d postgres
#   docker compose up --build
#
# The plugin also needs a running ApiCoreX Core to register with (CORE_URL,
# also run from the apicorex repo's docker-compose.yml) and the Identity
# plugin to have created the tenant schemas.
#
services:
  sync:
    build: .
    environment:
      DATABASE_URL: postgres://apicorex:apicorex@host.docker.internal:55432/apicorex?sslmode=disable
      PLUGIN_API_KEY: change-me-plugin-key
      CORE_URL: http://host.docker.internal:8080
      PLUGIN_ADDR: ":50052"
      PLUGIN_BASE_URL: http://sync:50052
      # Optional: comma-separated tenant-wide collections.
      # SYNC_SHARED_COLLECTIONS: org_settings,catalog
    ports:
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
